<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">One document, three answers</title><desc id="desc">The lending-desk example prints three operations. listBooks: GET and read, eligible. addBook: POST and write, not callable. lendBook: GET and explicit pay, not callable. A host still supplies authority and credentials.</desc><g fill="none" stroke="#374151" stroke-width="2"><rect x="10" y="20" width="700" height="45" rx="8"/><path d="M360 65v30M120 95h480M120 95v20M360 95v20M600 95v20"/><rect x="10" y="115" width="220" height="85" rx="8"/><rect x="250" y="115" width="220" height="85" rx="8"/><rect x="490" y="115" width="220" height="85" rx="8"/></g><g font-family="sans-serif" font-size="16" text-anchor="middle" fill="#111827"><text x="360" y="48">OpenAPI declaration: lending desk</text><text x="120" y="140">listBooks · GET</text><text x="120" y="165">read · eligible</text><text x="360" y="140">addBook · POST</text><text x="360" y="165">write · not callable</text><text x="600" y="140">lendBook · GET</text><text x="600" y="165">pay · not callable</text><text x="360" y="230">Declaration is evidence. The host owns permission and execution.</text></g></svg>
