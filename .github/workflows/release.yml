name: release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the existing draft only after owner approval
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test test/prior-place.test.ts test/compile-region.test.ts
      - name: Verify admitted producer obligations
        env:
          INSTRUMENT: ${{ runner.temp }}/topos-openapi-bound
        run: |
          npm install --prefix "$INSTRUMENT" --no-save --ignore-scripts --no-audit --no-fund @lapxo/bound@0.2.8
          node "$INSTRUMENT/node_modules/@lapxo/bound/dist/cli/verb.js" fold --check
      - name: Verify the exact delivery
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { strict as assert } from 'node:assert';
          import { createHash } from 'node:crypto';
          import { toposStanding } from '@lapxo/topos/standing';
          const manifest = JSON.parse(readFileSync('delivery/release.json'));
          assert.equal(manifest.version, JSON.parse(readFileSync('package.json')).version);
          assert.match(manifest.capsule, /^sha256:[0-9a-f]{64}$/);
          assert.match(manifest.standing, /^sha256:[0-9a-f]{64}$/);
          const hash = bytes => 'sha256:' + createHash('sha256').update(bytes).digest('hex');
          assert.equal(hash(readFileSync('delivery/' + manifest.capsule.slice(7) + '.tar.gz')), manifest.capsule);
          assert.equal(hash(readFileSync('delivery/standing.bound')), manifest.standing);
          assert.equal(toposStanding(readFileSync('TARGET.bound', 'utf8').trim().split('\n')), readFileSync('delivery/standing.bound', 'utf8'));
          NODE
  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix .instrument --no-save --ignore-scripts --no-audit --no-fund @lapxo/bound@0.2.8
      - name: Publish only the owner-approved existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          digest="$(node -e "const m=require('./delivery/release.json'); if(!/^sha256:[0-9a-f]{64}$/.test(m.capsule))process.exit(1); console.log(m.capsule)")"
          archive="${digest#sha256:}.tar.gz"
          standing="$(node -e "const m=require('./delivery/release.json'); if(!/^sha256:[0-9a-f]{64}$/.test(m.standing))process.exit(1); console.log(m.standing)")"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$tag")"
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          stage="$(mktemp -d "$RUNNER_TEMP/topos-openapi-release.XXXXXX")"
          trap 'rm -rf "$stage"' EXIT
          gh release download "$tag" --pattern approval-signed --dir "$stage"
          node .instrument/node_modules/@lapxo/bound/dist/cli/verb.js fold --as release "$stage/approval-signed" > "$stage/verdict"
          read -r status approved artifact source extra < "$stage/verdict"
          test "$status" = READY
          test -z "$extra"
          test "$approved" = "$digest"
          test "$artifact" = "$archive"
          test "$source" = "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$archive"
          for asset in "$archive" standing.bound release.json; do
            gh release download "$tag" --pattern "$asset" --dir "$stage"
            cmp "delivery/$asset" "$stage/$asset"
          done
          printf '%s  %s\n' "${digest#sha256:}" "$stage/$archive" | sha256sum -c -
          printf '%s  %s\n' "${standing#sha256:}" "$stage/standing.bound" | sha256sum -c -
          gh release edit "$tag" --draft=false
